<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" href="img/logo.jpg" type="image/jpeg">
    <title>Page Not Found | Riverview Fire Department</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        (function() {
            var path = window.location.pathname;
            var imageExtensions = /\.(jpg|jpeg|png|gif|webp|svg|ico)$/i;

            // Check if this is an image request in the root directory
            if (imageExtensions.test(path)) {
                var filename = path.split('/').pop();
                // Only redirect if it's in the root (no subdirectory)
                if (path === '/' + filename) {
                    window.location.replace('/img/' + filename);
                    return;
                }
            }
        })();
    </script>
    <style>
        /* Page-specific styles for 404.html */
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-dark-alt) 100%);
        }

        .error-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            color: white;
        }

        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: var(--primary-red-light);
            line-height: 1;
            margin-bottom: 1rem;
        }

        .error-message {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            color: #9ca3af;
        }

        .home-link {
            display: inline-block;
            background: var(--primary-red-light);
            color: white;
            padding: 1rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s;
        }

        .home-link:hover {
            background: var(--primary-red);
            transform: translateY(-2px);
        }

        .error-logo {
            margin-bottom: 2rem;
        }

        .error-logo img {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-logo">
            <img src="img/logo.jpg" alt="Riverview FD Logo">
        </div>
        <div class="error-code">404</div>
        <p class="error-message">The page you're looking for doesn't exist.</p>
        <a href="/" class="home-link">Return to Homepage</a>
    </div>
</body>
</html>
