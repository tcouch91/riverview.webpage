<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire District Locator</title>
    <!-- Using Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* A simple spinning animation for the loader */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body class="bg-gray-100 font-sans p-4 sm:p-8">

    <div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-lg shadow-md">
        
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-4">
            Fire District Locator
        </h1>
        <p class="text-gray-600 mb-6">
            Enter an address to determine which fire district it is in.
        </p>

        <!-- Address Form -->
        <div class="space-y-4">
            <div>
                <label for="address" class="block text-sm font-medium text-gray-700">Address</label>
                <input type="text" id="address" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm" placeholder="e.g., 123 Main St, Anytown, USA">
            </div>
            
            <button id="checkButton" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Check Address
            </button>
        </div>

        <!-- Result Display Area -->
        <div id="result" class="mt-6 p-4 border-dashed border-2 border-gray-200 rounded-md min-h-[100px] flex items-center justify-center">
            <span class="text-gray-500">Results will appear here...</span>
        </div>

    </div>

    <script>
        // --- IMPORTANT ---
        // 1. Host your Python 'app.py' on a service like Render or Heroku.
        // 2. Get the live URL (e.g., "https://my-fire-app.onrender.com")
        // 3. Replace the placeholder below with your LIVE backend URL.
        const BACKEND_URL = "https://fire-district-api.onrender.com"; // <-- REPLACE THIS
        // -----------------
        
        const addressInput = document.getElementById('address');
        const checkButton = document.getElementById('checkButton');
        const resultDiv = document.getElementById('result');

        checkButton.addEventListener('click', async () => {
            const address = addressInput.value.trim();

            if (!address) {
                displayError("Please enter an address.");
                return;
            }

            // Show loading state
            displayLoading();

            try {
                const response = await fetch(`${BACKEND_URL}/check_address`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ address: address }),
                });

                const data = await response.json();

                if (!response.ok) {
                    // Handle errors from the server (like 404, 500)
                    throw new Error(data.error || "An unknown error occurred.");
                }
                
                // Success! Display the result.
                displayResult(data);

            } catch (error) {
                console.error("Error fetching data:", error);
                displayError(`Error: ${error.message}`);
            }
        });

        function displayLoading() {
            resultDiv.innerHTML = '<div class="loader"></div>';
            checkButton.disabled = true;
            checkButton.innerText = "Checking...";
        }

        function displayError(message) {
            resultDiv.innerHTML = `<p class="text-red-600 font-medium">${message}</p>`;
            resetButton();
        }

        function displayResult(data) {
            let districtText = data.district;
            let textClass = "text-gray-900";

            if (data.district.includes("not found")) {
                textClass = "text-orange-700"; // Not in a district
            } else if (data.district.includes("Could not find")) {
                textClass = "text-red-600"; // Geocoding failed
            }

            resultDiv.innerHTML = `
                <div class="text-left w-full">
                    <p class="font-medium text-gray-700">Address Checked:</p>
                    <p class="mb-2 text-gray-900">${data.address}</p>
                    <p class="font-medium text-gray-700">Result:</p>
                    <p class="text-lg font-bold ${textClass}">${districtText}</p>
                </div>
            `;
            resetButton();
        }

        function resetButton() {
            checkButton.disabled = false;
            checkButton.innerText = "Check Address";
        }

    </script>
</body>
</html>
