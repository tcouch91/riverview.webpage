<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riverview Fire Department - Email Signature Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Custom Styles for Email Client Compatibility */
        .signature-preview {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            color: #333333;
            line-height: 1.4;
        }
        .signature-table td {
            vertical-align: top;
            padding-right: 15px;
        }
        .signature-name {
            font-size: 18px;
            font-weight: bold;
            color: #ce1126; /* Fire Engine Red */
            margin: 0;
        }
        .signature-title {
            font-size: 14px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0 0 4px 0;
            text-transform: uppercase;
        }
        .signature-dept {
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            margin: 0;
        }
        .signature-link {
            color: #ce1126;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
    <link rel="icon" href="img/logo.jpg" type="image/jpeg">
</head>
<body class="bg-white min-h-screen p-4 sm:p-6">

    <div class="max-w-4xl mx-auto bg-white shadow-lg rounded-lg overflow-hidden">

        <!-- Header -->
        <div class="bg-[#1a1a2e] text-white p-6 border-b-4 border-red-600 flex items-center gap-4">
            <img src="img/logo.jpg" alt="Logo" class="h-12 w-12">
            <div>
                <h1 class="text-2xl font-bold">Riverview Fire Department</h1>
                <p class="text-gray-400">Email Signature Generator</p>
            </div>
        </div>

        <div class="p-6 grid grid-cols-1 lg:grid-cols-2 gap-8">

            <!-- Input Form -->
            <div class="bg-white p-6 rounded border border-gray-200">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">1. Enter Your Details</h2>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Full Name</label>
                        <input type="text" id="inputName" value="John Doe" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-red-600 focus:border-red-600" oninput="updateSignature()">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Rank / Title</label>
                        <input type="text" id="inputTitle" value="Fire Chief" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-red-600 focus:border-red-600" oninput="updateSignature()">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Cell Phone</label>
                        <input type="text" id="inputPhone" value="555-0123" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-red-600 focus:border-red-600" oninput="updateSignature()">
                    </div>

                     <div>
                        <label class="block text-sm font-medium text-gray-700">Email Address</label>
                        <input type="text" id="inputEmail" value="jdoe@riverviewfire.org" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-red-600 focus:border-red-600" oninput="updateSignature()">
                    </div>
                </div>
            </div>

            <!-- Preview & Copy -->
            <div class="flex flex-col">
                <h2 class="text-lg font-semibold mb-4 text-gray-700">2. Preview & Copy</h2>

                <div class="flex-grow flex items-center justify-center bg-white border border-gray-200 rounded p-8 mb-4">
                    <!-- The Actual Signature Container -->
                    <div id="signature-container">
                        <!-- Standard HTML Table for Email Signatures -->
                        <table class="signature-table" border="0" cellpadding="0" cellspacing="0" style="font-family: Arial, sans-serif; max-width: 600px;">
                            <tr>
                                <!-- Text Info Column -->
                                <td style="vertical-align: top;">
                                    <h3 class="signature-name" id="sigName">John Doe</h3>
                                    <p class="signature-title" id="sigTitle">Fire Chief</p>

                                    <p class="signature-dept">Riverview Fire Department</p>

                                    <p style="margin: 2px 0 0 0; font-size: 13px; color: #555;">
                                        <span style="color: #ce1126;">C:</span> <span id="sigPhone">555-0123</span>
                                    </p>

                                    <p style="margin: 2px 0 0 0; font-size: 13px; color: #555;">
                                        <a href="mailto:jdoe@riverviewfire.org" class="signature-link" id="sigEmailLink">jdoe@riverviewfire.org</a>
                                    </p>
                                    <p style="margin: 2px 0 0 0; font-size: 13px;">
                                        <a href="http://www.riverviewfire.org" style="color: #ce1126; text-decoration: none; font-weight: bold;">www.riverviewfire.org</a>
                                    </p>
                                </td>
                            </tr>
                        </table>
                    </div>
                </div>

                <button onclick="copyToClipboard()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-full shadow-md transition duration-300 ease-in-out transform hover:-translate-y-0.5 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy Signature to Clipboard
                </button>
                <p id="copyMsg" class="text-center text-green-600 mt-2 hidden font-semibold">Signature copied! You can now paste it into your email settings.</p>

            </div>
        </div>
    </div>

    <script>
        function updateSignature() {
            // Get values
            const name = document.getElementById('inputName').value || 'John Doe';
            const title = document.getElementById('inputTitle').value || 'Title';
            const phone = document.getElementById('inputPhone').value || '555-0123';
            const email = document.getElementById('inputEmail').value || 'email@riverviewfire.org';

            // Update DOM
            document.getElementById('sigName').textContent = name;
            document.getElementById('sigTitle').textContent = title;
            document.getElementById('sigPhone').textContent = phone;
            document.getElementById('sigEmailLink').textContent = email;
            document.getElementById('sigEmailLink').href = 'mailto:' + email;
        }

        function copyToClipboard() {
            const range = document.createRange();
            const selection = window.getSelection();
            const element = document.getElementById('signature-container');

            selection.removeAllRanges();
            range.selectNodeContents(element);
            selection.addRange(range);

            document.execCommand('copy');

            selection.removeAllRanges();

            const msg = document.getElementById('copyMsg');
            msg.classList.remove('hidden');
            setTimeout(() => {
                msg.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
